services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: rudra-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rudra_netra
      POSTGRES_USER: rudra
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ../backend/migrations:/migrations:ro
      - ../backend/scripts:/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rudra -d rudra_netra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rudra-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: rudra-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222" # NATS Management / Monitoring
    command: ["--jetstream", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 5s
      retries: 5

  rudra-ingest:
    build:
      context: ../backend
      dockerfile: Dockerfile.ingest
    container_name: rudra-ingest
    restart: unless-stopped
    ports:
      - "5040:5040"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      RUDRA_SERVER_HOST: "0.0.0.0"
      RUDRA_DATABASE_HOST: "postgres"
      RUDRA_DATABASE_PORT: 5432
      RUDRA_DATABASE_USER: "rudra"
      RUDRA_DATABASE_PASSWORD: "secretpassword"
      RUDRA_DATABASE_DBNAME: "rudra_netra"
      RUDRA_REDIS_ADDR: "redis:6379"
      RUDRA_NATS_URL: "nats://nats:4222"
      RUDRA_INGEST_HOST: "0.0.0.0"
      RUDRA_INGEST_PORT: 5040

  rudra-api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    container_name: rudra-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      RUDRA_SERVER_HOST: "0.0.0.0"
      RUDRA_SERVER_PORT: 8080
      RUDRA_DATABASE_HOST: "postgres"
      RUDRA_DATABASE_PORT: 5432
      RUDRA_DATABASE_USER: "rudra"
      RUDRA_DATABASE_PASSWORD: "secretpassword"
      RUDRA_DATABASE_DBNAME: "rudra_netra"
      RUDRA_REDIS_ADDR: "redis:6379"
      RUDRA_NATS_URL: "nats://nats:4222"
      RUDRA_JWT_SECRET: "rudra-netra-super-secret-key-change-in-prod-min-32-chars"

  rudra-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    container_name: rudra-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      RUDRA_DATABASE_HOST: "postgres"
      RUDRA_DATABASE_PORT: 5432
      RUDRA_DATABASE_USER: "rudra"
      RUDRA_DATABASE_PASSWORD: "secretpassword"
      RUDRA_DATABASE_DBNAME: "rudra_netra"
      RUDRA_REDIS_ADDR: "redis:6379"
      RUDRA_NATS_URL: "nats://nats:4222"

volumes:
  pgdata:
  redisdata:
